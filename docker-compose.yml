services:
  db:
    image: postgres:17
    container_name: football_league_db
    environment:
      POSTGRES_DB: football_league
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - football_league_data:/var/lib/postgresql/data

volumes:
  football_league_data: